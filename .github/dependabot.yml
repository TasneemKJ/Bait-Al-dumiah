version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: {interval: monthly}
    open-pull-requests-limit: 1
    groups: {npm: {patterns: ['*']}}
  - package-ecosystem: pip
    directory: /
    schedule: {interval: monthly}
    open-pull-requests-limit: 1
    groups: {pip: {patterns: ['*']}}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: monthly}
    open-pull-requests-limit: 1
    groups: {actions: {patterns: ['*']}}
