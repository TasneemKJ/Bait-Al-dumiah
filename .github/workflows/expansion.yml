name: Verify living house expansion
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: expansion-${{ github.ref }}
  cancel-in-progress: true
jobs:
  expansion:
    runs-on: ubuntu-latest
    # This journey performs all three real rituals and the owned-keepsake tail.
    # cf787a2 reached 43/48 checks at the former 20-minute cap, with no failures.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/art_check.py
      - run: python scripts/expansion_check.py
      - name: Trim failure evidence
        if: failure()
        run: |
          python -m pip install pillow
          python scripts/trim-artifacts.py ${{ github.job }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: failure-evidence-${{ github.job }}
          path: failure-evidence/
          retention-days: 1
          compression-level: 9
          if-no-files-found: ignore
  stories:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Play carried-object stories on desktop and phones
        run: python scripts/story_check.py
      - name: Trim failure evidence
        if: failure()
        run: |
          python -m pip install pillow
          python scripts/trim-artifacts.py ${{ github.job }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: failure-evidence-${{ github.job }}
          path: failure-evidence/
          retention-days: 1
          compression-level: 9
          if-no-files-found: ignore
  tea:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        scenario: [desktop, phone, progression]
    env:
      TEA_SCENARIO: ${{ matrix.scenario }}
      TEA_HEADED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Pour and serve tea through mouse, touch and keyboard
        run: xvfb-run -a python scripts/tea_check.py
      - name: Trim failure evidence
        if: failure()
        run: |
          python -m pip install pillow
          python scripts/trim-artifacts.py ${{ github.job }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: failure-evidence-${{ github.job }}-${{ matrix.scenario }}
          path: failure-evidence/
          retention-days: 1
          compression-level: 9
          if-no-files-found: ignore
  visibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-visibility.txt
      - run: python -m playwright install --with-deps chromium
      - name: Verify real background tabs release held tea and sewing
        run: xvfb-run -a python scripts/visibility_check.py
      - name: Trim failure evidence
        if: failure()
        run: |
          python -m pip install pillow
          python scripts/trim-artifacts.py ${{ github.job }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: failure-evidence-${{ github.job }}
          path: failure-evidence/
          retention-days: 1
          compression-level: 9
          if-no-files-found: ignore
  stitch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scenario: [desktop, phone, progression]
    env:
      STITCH_SCENARIO: ${{ matrix.scenario }}
      STITCH_HEADED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Compile the affected physical-play fixtures
        run: python -m py_compile scripts/stitch_check.py scripts/stitch_gestures.py scripts/visibility_check.py scripts/story_check.py scripts/expansion_check.py scripts/tea_check.py scripts/emit-review-images.py
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Trace, repair and finish cloth through actual needle input
        run: xvfb-run -a python scripts/stitch_check.py
      - name: Trim failure evidence
        if: failure()
        run: |
          python -m pip install pillow
          python scripts/trim-artifacts.py ${{ github.job }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: failure-evidence-${{ github.job }}-${{ matrix.scenario }}
          path: failure-evidence/
          retention-days: 1
          compression-level: 9
          if-no-files-found: ignore
