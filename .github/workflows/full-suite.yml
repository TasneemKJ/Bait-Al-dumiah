name: Full suite
# Weekly safety net on main plus manual runs. No push/PR triggers and no deploys.
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: full-suite
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'main' || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/ui_check.py
      - run: python scripts/art_check.py
      - run: python scripts/atmosphere_check.py
      - run: npm run test:browser
      - name: Trim failure evidence
        if: failure()
        run: |
          python -m pip install pillow
          python scripts/trim-artifacts.py browser
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: failure-evidence-browser
          path: failure-evidence/
          retention-days: 1
          compression-level: 9
          if-no-files-found: ignore
  chimes:
    uses: ./.github/workflows/chimes.yml
  expansion:
    uses: ./.github/workflows/expansion.yml
