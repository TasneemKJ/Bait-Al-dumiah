name: Verify dollhouse
on:
  push:
    branches: [main, feat/living-dollhouse]
  pull_request:
permissions:
  contents: read
concurrency:
  group: dollhouse-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - name: Package reproducible source workspace
        run: tar -czf workspace.tgz src scripts public docs index.html package.json package-lock.json requirements.txt README.md .github .gitignore node_modules/three/build node_modules/three/examples/jsm/controls/OrbitControls.js node_modules/three/LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: source-workspace
          path: workspace.tgz
          retention-days: 2
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Play desktop and mobile game flows
        run: |
          node scripts/serve.mjs dist > /tmp/dollhouse-server.log 2>&1 &
          python scripts/play_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gameplay-evidence
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: playable-dollhouse
          path: dist/
          retention-days: 7
