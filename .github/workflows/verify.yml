name: Verify dollhouse
on:
  push:
    branches: [main]
    paths-ignore: ['**.md','docs/**']
  pull_request:
    paths-ignore: ['**.md','docs/**']
permissions:
  contents: read
concurrency:
  group: dollhouse-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Fast gate (target under 2 minutes): node tests plus the static build.
  # Heavy browser suites are manual or weekly; see full-suite.yml and README.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify
