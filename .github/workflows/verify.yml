name: Verify dollhouse
on:
  push:
    branches: [main, feat/living-dollhouse]
  pull_request:
permissions:
  contents: read
concurrency:
  group: dollhouse-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Package reproducible source workspace
        run: tar -czf workspace.tgz src scripts tests public docs index.html package.json package-lock.json requirements.txt README.md AGENTS.md vercel.json .github .gitignore node_modules/three/build node_modules/three/examples/jsm/controls/OrbitControls.js node_modules/three/LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: source-workspace
          path: workspace.tgz
          retention-days: 2
      - run: npm run verify
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Play desktop and mobile game flows
        run: npm run test:browser
      - name: Record source identity
        if: always()
        run: |
          mkdir -p artifacts
          sha256sum src/*.js src/render/*.js src/*.css tests/* package.json index.html scripts/build.mjs scripts/serve.mjs > artifacts/source-sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dollhouse-evidence
          path: artifacts/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: playable-dollhouse
          path: dist/
          retention-days: 14
