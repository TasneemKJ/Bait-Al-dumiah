name: Verify physical moon chimes
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: chimes-${{ github.ref }}
  cancel-in-progress: true
jobs:
  chimes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scenario: [desktop, phone]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/chime_dom_check.py
      - run: python scripts/art_check.py
      - name: Play the actual hanging instrument
        run: python scripts/chime_check.py
        env:
          CHIME_SCENARIO: ${{ matrix.scenario }}
      - name: Trim failure evidence
        if: failure()
        run: |
          python -m pip install pillow
          python scripts/trim-artifacts.py ${{ github.job }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: failure-evidence-${{ github.job }}-${{ matrix.scenario }}
          path: failure-evidence/
          retention-days: 1
          compression-level: 9
          if-no-files-found: ignore
